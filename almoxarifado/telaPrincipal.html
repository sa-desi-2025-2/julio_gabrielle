<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Usuário</title>
  <link rel="stylesheet" href="telaPrincipal.css">
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <h2 class="logo">Almoxarifado</h2>
      <ul class="menu">
        <li class="ativo">Início</li>
        <li>Equipamentos</li>
        <li>Ferramentas</li>
        <li>Configurações</li>
      </ul>
    </aside>

    <main class="content">
      <header class="header">
        <h1>Equipamentos Ativos</h1>
        <div class="actions">
          <input type="text" placeholder="Buscar equipamento..." class="search">
          <button class="btn">Filtrar</button>
        </div>
      </header>

      <section class="table-section">
        <table class="table">
          <thead>
            <tr>
              <th>Nome do Equipamento</th>
              <th>Localização</th>
              <th>Quantidade</th>
              <th>Marca</th>
              <th>Responsável</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Equipamento 1</td>
              <td>Projeto A</td>
              <td>5</td>
              <td>RMK</td>
              <td>Lucas</td>
              <td>
              
                <div class="dropdown">
                  <button class="btn editar dropbtn">⚙️ Ações</button>
                  <div class="dropdown-content">
                    <label for="qtd1">Quantidade:</label>
                    <input type="number" id="qtd1" min="1" value="1">
                    <button class="acao-btn pegar">📦 Pegar item</button>
                    <button class="acao-btn devolver">↩️ Devolver item</button>
                  </div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

    
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const buttons = document.querySelectorAll('.dropbtn');
    
        buttons.forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation(); 
    
            
            document.querySelectorAll('.dropdown-content').forEach(menu => {
              if (menu !== btn.nextElementSibling) {
                menu.classList.remove('show');
              }
            });
    
           
            const dropdown = btn.nextElementSibling;
            dropdown.classList.toggle('show');
          });
        });
    
       
        document.addEventListener('click', e => {
          document.querySelectorAll('.dropdown-content').forEach(menu => {
            menu.classList.remove('show');
          });
        });
      });
    </script>
  </body>
</html>
