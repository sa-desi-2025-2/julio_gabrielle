<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Usuário</title>
  <link rel="stylesheet" href="../css/telaPrincipal.css">
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <h2 class="logo">Almoxarifado</h2>
      <ul class="menu">
        <li class="ativo">Início</li>
        <li>Equipamentos</li>
        <li>Ferramentas</li>
        <li>Configurações</li>
      </ul>
    </aside>

    <main class="content">
      <header class="header">
        <h1>Equipamentos Ativos</h1>
        <div class="actions">
          <input type="text" placeholder="Buscar equipamento..." class="search">
          <button class="btn">Filtrar</button>
        </div>
      </header>

      <section class="table-section">
        <table class="table">
          <thead>
            <tr>
              <th>Nome do Equipamento</th>
              <th>Localização</th>
              <th>Quantidade</th>
              <th>Marca</th>
              <th>Responsável</th>
            
            </tr>
          </thead>
          <tbody>
            <tr class="data-row" tabindex="0" aria-expanded="false">
              <td>Equipamento 1</td>
              <td>Projeto A</td>
              <td>5</td>
              <td>RMK</td>
              <td>Lucas</td>
              
       
            </tr>

            <!-- linha expansível — aparece quando a linha acima é clicada -->
            <tr class="expand-row" hidden>
              <td colspan="6" class="expand-cell">
                <div class="row-actions">
                  <button class="acao-btn pegar">Pegar Equipamento</button>
                  <button class="acao-btn devolver">Devolver Equipamento</button>
                </div>
              </td>
            </tr>

          </tbody>
        </table>
      </section>
    </main>
  </div>

  

    <!-- Accordion: expande a linha inteira ao clicar -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const fab = document.getElementById('fab');
      const speedDial = document.getElementById('speedDial');
      const actions = document.getElementById('speedActions');

      const open = () => {
        speedDial.classList.add('open');
        fab.classList.add('open');
        actions.setAttribute('aria-hidden', 'false');
        fab.setAttribute('aria-expanded', 'true');
      };
      const close = () => {
        speedDial.classList.remove('open');
        fab.classList.remove('open');
        actions.setAttribute('aria-hidden', 'true');
        fab.setAttribute('aria-expanded', 'false');
      };

      fab.addEventListener('click', (e) => {
        e.stopPropagation();
        speedDial.classList.contains('open') ? close() : open();
      });

      document.addEventListener('click', (e) => {
        if (!speedDial.contains(e.target)) close();
      });

      document.querySelectorAll('.sd-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.action;
          if (action === 'adicionar-usuario') {
            window.location.href = 'registra_funcionario.html';
          } else if (action === 'adicionar-equipamento') {
            window.location.href = 'editarEquipamento.html';
          }
        });
      });
    });
  </script>
  </body>
</html>
