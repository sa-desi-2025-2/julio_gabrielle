<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha Expansível</title>
    <style>
        /* Estilo para o corpo da página (opcional, apenas para centralizar) */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        /* O contêiner principal da linha */
        .linha-equipamento {
            width: 500px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #fff;
            margin-bottom: 10px;
            overflow: hidden; /* Garante que o border-radius funcione */
        }

        /* A parte clicável (a linha de uma coluna) */
        .linha-cabecalho {
            display: block; /* Faz o <summary> se comportar como uma div */
            padding: 16px 20px;
            background-color: #f9f9f9;
            cursor: pointer;
            font-weight: bold;
            color: #333;
            border-bottom: 1px solid #eee;
        }

        /* Remove o triângulo padrão do <summary> no Chrome/Safari */
        .linha-cabecalho::-webkit-details-marker {
            display: none;
        }

        /* Remove o triângulo padrão do <summary> no Firefox */
        .linha-cabecalho {
            list-style: none;
        }

        /* Adiciona um indicador (+) que vira (-) quando aberto */
        .linha-cabecalho::before {
            content: '+';
            font-weight: bold;
            margin-right: 10px;
            font-family: monospace;
            display: inline-block;
            transition: transform 0.2s;
        }

        /* Quando a <details> está aberta, muda o indicador */
        .linha-equipamento[open] > .linha-cabecalho::before {
            content: '−'; /* Símbolo de menos */
            transform: rotate(180deg);
        }

        /* A área de conteúdo que abre (com os botões) */
        .linha-conteudo {
            padding: 20px;
            background-color: #fff;
            display: flex;
            gap: 15px; /* Espaçamento entre os botões */
            justify-content: flex-start; /* Alinha botões à esquerda */
            border-top: 1px solid #eee; /* Linha sutil de separação */
        }

        /* Estilo base dos botões */
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: white;
            transition: background-color 0.2s;
        }

        /* Botão de Pegar (Verde) */
        .btn-pegar {
            background-color: #28a745;
        }
        .btn-pegar:hover {
            background-color: #218838;
        }

        /* Botão de Devolver (Vermelho) */
        .btn-devolver {
            background-color: #dc3545;
        }
        .btn-devolver:hover {
            background-color: #c82333;
        }

    </style>
</head>
<body>

    <details class="linha-equipamento">
        <summary class="linha-cabecalho">
            Notebook Dell Inspiron 15 (ID: 1001)
        </summary>
        <div class="linha-conteudo">
            <button class="btn btn-pegar">Pegar Equipamento</button>
            <button class="btn btn-devolver">Devolver Equipamento</button>
        </div>
    </details>

    </body>
</html>
